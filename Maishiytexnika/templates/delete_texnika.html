<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            padding: 40px;
        }

        .box {
            width: 420px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
            text-align: center;
        }

        img {
            border-radius: 8px;
            margin-bottom: 15px;
        }

        h3 {
            margin-bottom: 20px;
        }

        .btn-danger {
            padding: 10px 20px;
            background: #d9534f;
            border: none;
            color: white;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-danger:hover {
            background: #b52b27;
        }

        .back-link {
            display: inline-block;
            margin-top: 15px;
            text-decoration: none;
            font-size: 15px;
            color: #007bff;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>

</head>
<body>

<div class="box">

    {% if texnika.image %}
        <img src="{{ texnika.image.url }}" alt="{{ texnika.name }}" width="200">
    {% endif %}

    <h3>Haqiqatdan ham o'chirasizmi?</h3>

    <form method="POST">
        {% csrf_token %}
        <button class="btn-danger" type="submit">Ha, o'chiraman</button>
    </form>

    <a class="back-link" href="{% url 'texnika_detail' texnika.pk %}">
        Yo‘q, orqaga qaytaman
    </a>

</div>

</body>
</html>
