<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>{{ category.name }}</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0,0,0,0.1);
        }

        h1 {
            margin-bottom: 20px;
        }

        ul {
            list-style: none;
            padding-left: 0;
        }

        li {
            background: #fafafa;
            margin-bottom: 10px;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #e1e1e1;
        }

        a {
            text-decoration: none;
            font-size: 17px;
            color: #007bff;
        }

        a:hover {
            text-decoration: underline;
        }

        .empty {
            font-size: 16px;
            color: #777;
        }
    </style>

</head>
<body>

<div class="container">

    <h1>{{ category.name }}</h1>

    <ul>
        {% for t in texnikalar %}
            <li>
                <a href="/products/{{ t.pk }}/">
                    {{ t.name }} — {{ t.price }} so'm
                </a>
            </li>
        {% empty %}
            <li class="empty">Bu kategoriyada texnika yo‘q.</li>
        {% endfor %}
    </ul>

</div>

</body>
</html>
