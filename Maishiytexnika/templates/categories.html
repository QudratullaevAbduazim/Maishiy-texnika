<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <title>Kategoriyalar va Texnikalar</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: #f4f4f9;
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        /* Kategoriya ro‘yxati */
        ul.category-list {
            list-style: none;
            padding: 0;
            margin-bottom: 40px;
        }

        ul.category-list li {
            background: white;
            padding: 12px 15px;
            margin: 6px 0;
            border-radius: 6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: 0.2s;
        }

        ul.category-list li:hover {
            transform: translateX(5px);
            box-shadow: 0 3px 8px rgba(0,0,0,0.18);
        }

        ul.category-list a {
            text-decoration: none;
            color: #333;
            font-size: 1.1rem;
            font-weight: 600;
        }

        /* Create button */
        .create-btn {
            display: inline-block;
            background: #4CAF50;
            color: white;
            padding: 10px 18px;
            margin-bottom: 25px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: bold;
            transition: 0.2s;
        }

        .create-btn:hover {
            background: #45a049;
        }

        /* Texnika list */
        .tech-card {
            background: white;
            padding: 15px;
            border-radius: 7px;
            margin-bottom: 15px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }

        .tech-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #222;
        }

        .update-btn {
            margin-top: 10px;
            background: #007bff;
            color: white;
            padding: 8px 14px;
            border-radius: 5px;
            text-decoration: none;
            font-size: 0.95rem;
            transition: 0.2s;
        }

        .update-btn:hover {
            background: #005fcc;
        }
    </style>
</head>
<body>

<h1>Kategoriyalar</h1>

<ul class="category-list">
    {% for category in categories %}
        <li>
            <a href="/category/{{ category.pk }}/">{{ category.name }}</a>
        </li>
    {% endfor %}
</ul>

<a href="{% url 'create_texnika' %}" class="create-btn">+ Create Texnika</a>

<hr><br>

{% for texnika in texnikalar %}
<div class="tech-card">
    <p class="tech-title">{{ texnika.name }}</p>

    <a href="{% url 'update_texnika' texnika.pk %}" class="update-btn">Update</a>
</div>
{% endfor %}

</body>
</html>
